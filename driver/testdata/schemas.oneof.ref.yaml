openapi: '3.2.0'
info:
  title: Sample
  version: '1.0'
  description: sample tests
paths:
  /test:
    get:
      summary: test endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      description: A pet, either a cat or a dog.
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
        - type: object
          properties:
            unknown:
              type: string
    Cat:
      type: object
      properties:
        meow:
          type: boolean
          description: Does it meow.
      required:
        - meow
    Dog:
      type: object
      properties:
        bark:
          type: boolean
          description: Does it bark.
