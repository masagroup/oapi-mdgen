openapi: '3.2.0'
info:
  title: Sample
  version: '1.0'
  description: sample tests
paths:
  /test:
    get:
      summary: test endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Unit'
                  - $ref: '#/components/schemas/Party'
                discriminator:
                  propertyName: kind
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Unit'
                    - $ref: '#/components/schemas/Party'
components:
  schemas:
    Unit:
      type: object
      properties:
        kind:
          type: string
        id:
          type: integer
    Party:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
